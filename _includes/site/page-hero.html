<section class="page-hero" aria-labelledby="page-title">
  <picture class="hero-bg">
    <source media="(max-width:700px)" type="image/webp" srcset="{{ '/assets/site/img/helix-square-1000.webp' | relative_url }}">
    <source type="image/webp" srcset="{{ '/assets/site/img/helix-wide-1440.webp' | relative_url }} 1440w, {{ '/assets/site/img/helix-wide-2400.webp' | relative_url }} 2400w" sizes="100vw">
    <img src="{{ '/assets/site/img/helix-wide-1440.jpg' | relative_url }}" alt="" width="1440" height="840" fetchpriority="high">
  </picture>
  <div class="wrap">
    <div class="glass">
      {% if page.kicker %}<span class="kicker">{{ page.kicker }}</span>{% endif %}
      <h1 id="page-title">{{ page.heading | default: page.title }}</h1>
      {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
    </div>
  </div>
  <p class="credit"><a href="{{ site.data.profile.hero_credit_url }}">{{ site.data.profile.hero_credit }}</a></p>
</section>
